# ═══════════════════════════════════════════════════════════════
# GROOT configuration
# ═══════════════════════════════════════════════════════════════

framework:
  name: GR00T

  # four layers compose
  compose:
    trainer: BCTrainer
    architecture: VLMActionModel
    condition: GlobalProjection
    action: FlowMatchingMSE

  # VLM backbone config
  qwenvl:
    base_vlm: "Qwen/Qwen2.5-VL-3B-Instruct"
    attn_implementation: flash_attention_2
    vl_hidden_dim: 2048

  # Action model config
  action_model:
    action_model_type: DiT-B
    action_dim: 7
    state_dim: 7
    future_action_window_size: 7
    past_action_window_size: 0
    hidden_size: 1024
    repeated_diffusion_steps: 8
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    num_inference_timesteps: 4
    diffusion_model_cfg:
      cross_attention_dim: 2048
      num_layers: 16
      num_heads: 12
      dropout: 0.2
