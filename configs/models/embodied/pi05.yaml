# Pi05
# Training 

# Pi05Model (loongforge/embodied/model/pi05/modeling_pi05.py)
model_type: pi05

# tokenizer-path
tokenizer_name: google/paligemma-3b-pt-224
# Task dimensions
action_dim: 7
state_dim: 7
action_horizon: 50
max_action_dim: 32
max_state_dim: 32

image_size: 224
image_normalize_mode: identity

# Training switches
freeze_vision_encoder: false
train_expert_only: false
gradient_checkpointing: false
compile_model: true
compile_mode: max-autotune
