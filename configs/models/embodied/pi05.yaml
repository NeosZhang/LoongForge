# Pi05

model:
  model_type: pi05

  # Task dimensions
  action_dim: 7
  state_dim: 7
  action_horizon: 50
  max_action_dim: 32
  max_state_dim: 32

  # Training
  gradient_checkpointing: false
  compile_model: true
  compile_mode: max-autotune

data:
  image_size: 224
  image_normalize_mode: identity
