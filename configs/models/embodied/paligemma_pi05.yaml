framework:
  name: PaliGemmaPi05
  pi05: true                         # true=π₀.₅(adaRMS), false=π₀(state+time concat)

  # four layers config
  compose:
    trainer: BCTrainer
    architecture: VLMActionModel
    condition: Pi0JointQKV      # Pi0 joint qkv
    action: Pi0FlowMatching       # Pi0 flow matching loss

  # ── VLM Backbone (PaliGemma 3B) ──
  backbone:
    model_type: Paligemma
    base_vlm: "google/paligemma-3b-pt-224"
    attn_implementation: flash_attention_2
    hidden_dim: 2048                   # PaliGemma Gemma 2B hidden size
    num_images: 2                      # double eyes (agentview + eye_in_hand)
    image_mask: [true, true]           # two views affective
    tokenize_format: openpi            # BOS + text + \n
    max_token_len: 48
    discrete_state_input: true         # π₀.₅: state discrete token prompt

  # ── Action Expert (dependent Gemma 300M) ──
  action_model:
    action_model_type: Pi0Expert
    action_dim: 7                      # LIBERO: 3 pos + 3 euler + 1 gripper
    state_dim: 7                       # same as action_dim (eef_pos + eef_euler + gripper)
    action_horizon: 10                 # LIBERO experiment
    future_action_window_size: 9
    past_action_window_size: 0
    action_expert_width: 1024          # Gemma expert hidden size
    action_expert_depth: 18            # 18 layers transformer
    action_expert_mlp_dim: 4096
    action_expert_num_heads: 8
    action_expert_num_kv_heads: 1      # GQA: 1 KV head
    action_expert_head_dim: 256
    num_inference_steps: 10            # Euler ODE steps
    noise_beta_alpha: 1.5              # Beta distribution parameters
    noise_beta_beta: 1.0
    repeated_diffusion_steps: 1        # data repeated（1=no expanded）
    precision: bfloat16
