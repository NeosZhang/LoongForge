framework:
  name: PaliGemmaPi05
  pi05: true                         # true=π₀.₅(adaRMS), false=π₀(state+time concat)
  gradient_checkpointing: false
  debug_fast_init: true

  compose:
    trainer: BCTrainer
    architecture: PaliGemmaPi05
    condition: none
    action: none

  backbone:
    paligemma_variant: gemma_2b
    num_images: 2
    image_mask: [true, true]
    image_size: 224
    max_token_len: 48
    discrete_state_input: true
    tokenizer_name: "/ssd1/yexiaochuan/paligemma-3b-pt-224"  # override via CLI or TOKENIZER_PATH env
    freeze_vision_encoder: false
    train_expert_only: false

  action_model:
    action_dim: 7
    action_horizon: 10
    max_action_dim: 32
    max_state_dim: 32
    action_expert_variant: gemma_300m
    precision: bfloat16

wandb_mode: disabled

datasets:
  vla_data:
    type: vla                          # Key used in dataloaders dict returned by prepare_data
    dataloader_module: lerobot_datasets
