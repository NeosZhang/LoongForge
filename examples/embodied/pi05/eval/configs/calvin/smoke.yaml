benchmark:
  name: calvin
  suite: task_D_D
  dataset_path: /path/to/calvin/task_D_D
  calvin_config_path: /path/to/calvin/calvin_models/conf
  eval_sequences_path: /path/to/calvin/eval_sequences.json
  num_sequences: 1
  max_steps_per_subtask: 360
  control_hz: 30

model:
  backend: loongforge
  model_type: pi05
  name: loongforge-pi05-calvin-smoke
  ckpt_path: /path/to/pi05/checkpoint/steps_10
  dataset_statistics_path: /path/to/pi05/dataset_statistics.json
  tokenizer_name: /path/to/paligemma-3b-pt-224
  action_dim: 7
  state_dim: 7
  action_horizon: 50
  max_action_dim: 32
  max_state_dim: 32
  use_bf16: false
  compile_model: false

server:
  host: 127.0.0.1
  port: 12113
  health_port: 12114
  python: /workspace/miniconda3/envs/loongforge/bin/python
  log: /workspace/LoongForge-VLA/loongforge/embodied/eval/reports/pi05/calvin/smoke/policy_server.log
  start_timeout_sec: 900

env:
  eval_root: /workspace/LoongForge-VLA/loongforge/embodied/eval
  loongforge_root: /workspace/LoongForge-VLA
  mujoco_gl: osmesa
  pyopengl_platform: osmesa
  ld_library_path: /path/to/nvidia_lib

run:
  output_dir: /workspace/LoongForge-VLA/loongforge/embodied/eval/reports/pi05/calvin/smoke
  seed: 7
  save_trace: true
  save_replay: false

timeouts:
  policy_call_ms: 600000
  per_step_sec: 600
  per_episode_sec: 3000
