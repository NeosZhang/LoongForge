benchmark:
  name: robotwin
  task_name: adjust_bottle
  task_config: demo_clean
  start_seed: 100001
  episodes_per_task: 1
  max_steps: 5
  disable_expert_check: true

model:
  backend: loongforge
  model_type: pi05
  name: loongforge-pi05-robotwin-random-init
  action_dim: 14
  state_dim: 14
  action_horizon: 50
  max_action_dim: 32
  max_state_dim: 32
  compile_model: false
  action_mode: abs

server:
  host: 127.0.0.1
  port: 12493
  health_port: 12494
  python: /workspace/miniconda3/envs/loongforge/bin/python
  log: /workspace/LoongForge-VLA/loongforge/embodied/eval/reports/pi05/robotwin/random_init_5step/policy_server.log
  start_timeout_sec: 900
  random_init: true
  ckpt_path: /workspace/LoongForge-VLA/loongforge/embodied/eval
  loongforge_root: /workspace/LoongForge-VLA
  tokenizer_path: /path/to/paligemma-3b-pt-224
  use_bf16: false

env:
  eval_root: /workspace/LoongForge-VLA/loongforge/embodied/eval
  robotwin_root: /workspace/RoboTwin
  robotwin_python: /workspace/miniconda3/envs/robotwin/bin/python

run:
  output_dir: /workspace/LoongForge-VLA/loongforge/embodied/eval/reports/pi05/robotwin/random_init_5step
  seed: 0
  ckpt_setting: loongforge_pi05_random_init
  worker_local_files: true
  disable_eval_video_log: false
  keep_config: true

timeouts:
  policy_call_ms: 600000
  per_step_sec: 600
  per_episode_sec: 300
