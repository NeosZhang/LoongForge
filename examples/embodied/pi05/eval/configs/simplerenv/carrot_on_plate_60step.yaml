benchmark:
  name: simplerenv
  task_name: widowx_carrot_on_plate
  robot_setup: widowx
  scene_name: bridge_table_1_v1
  rgb_overlay_path: /workspace/SimplerEnv/ManiSkill2_real2sim/data/real_inpainting/bridge_real_eval_1.png
  sim_freq: 500
  control_freq: 5
  control_mode: arm_pd_ee_target_delta_pose_align2_gripper_pd_joint_pos
  action_scale: 1.0
  rotation_mode: euler
  max_steps: 60
  success_settle_steps: 0
  robot_init_x: 0.147
  robot_init_y: 0.028

model:
  backend: loongforge
  model_type: pi05
  name: loongforge-pi05-simplerenv-carrot
  ckpt_path: /path/to/pi05/checkpoint/steps_10
  dataset_statistics_path: /path/to/pi05/dataset_statistics.json
  tokenizer_name: /path/to/paligemma-3b-pt-224
  action_dim: 7
  state_dim: 7
  action_horizon: 50
  max_action_dim: 32
  max_state_dim: 32
  use_bf16: false
  compile_model: false

server:
  host: 127.0.0.1
  port: 12193
  health_port: 12194
  python: /workspace/miniconda3/envs/loongforge/bin/python
  log: /workspace/LoongForge-VLA/loongforge/embodied/eval/reports/pi05/simplerenv/carrot_on_plate_60step/policy_server.log
  start_timeout_sec: 900

env:
  eval_root: /workspace/LoongForge-VLA/loongforge/embodied/eval
  loongforge_root: /workspace/LoongForge-VLA
  simplerenv_root: /workspace/SimplerEnv
  ld_library_path: /path/to/nvidia_lib
  nvidia_lib_dir: /path/to/nvidia_lib
  nvidia_icd_json: /path/to/nvidia_icd.json

run:
  output_dir: /workspace/LoongForge-VLA/loongforge/embodied/eval/reports/pi05/simplerenv/carrot_on_plate_60step
  seed: 7
  episode_idx: 0
  obj_episode_id: 0
  save_trace: true
  save_replay: true
  action_ensemble: true
  action_ensemble_horizon: 7
  action_ensemble_alpha: 0.1
  cfg_scale: 1.5
  disable_action_cache: false

timeouts:
  policy_call_ms: 600000
  per_step_sec: 600
  per_episode_sec: 900
