model:
  backend: mock
  model_type: mock
  name: mock
  action_dim: 7
  action_chunk_size: 8

benchmark:
  name: maniskill
  task_name: PickCube-v1
  robot_uid: panda
  instruction: pick up the cube
  obs_mode: rgbd
  control_mode: pd_ee_delta_pose
  control_freq: 5
  render_mode: rgb_array
  sim_backend: auto
  render_backend: gpu
  nvidia_icd_json: /ssd1/opt/nvidia_lib/10_nvidia.json
  nvidia_lib_dir: /ssd1/opt/nvidia_lib
  camera_name: base_camera
  action_scale: 1.0
  max_steps: 5

server:
  host: 127.0.0.1
  port: 12113
  health_port: 12114
  start_timeout_sec: 60
  log: /ssd1/sunyuehang/LoongForge-VLA/loongforge/embodied/eval/reports/mock/maniskill/mock_rgbd_smoke/policy_server.log

timeouts:
  policy_call_ms: 20000
  per_step_sec: 20
  per_episode_sec: 600

run:
  seed: 7
  episode_idx: 0
  output_dir: /ssd1/sunyuehang/LoongForge-VLA/loongforge/embodied/eval/reports/mock/maniskill/mock_rgbd_smoke
  save_replay: true
  save_trace: true
  timestamped_output: true
  disable_action_cache: false
  cfg_scale: 1.0

env:
  loongforge_root: /ssd1/sunyuehang/LoongForge-VLA
  eval_root: /ssd1/sunyuehang/LoongForge-VLA/loongforge/embodied/eval
