model:
  backend: mock
  model_type: mock
  name: mock
  action_dim: 7
  action_chunk_size: 8

benchmark:
  name: maniskill
  task_name: PickCube-v1
  robot_uid: panda
  instruction: pick up the cube
  obs_mode: state
  control_mode: pd_ee_delta_pose
  control_freq: 5
  render_mode: null
  sim_backend: cpu
  render_backend: pci:0
  camera_name: base_camera
  action_scale: 1.0
  allow_dummy_image: true
  max_steps: 5

server:
  host: 127.0.0.1
  port: 12103
  health_port: 12104
  start_timeout_sec: 60
  log: /ssd1/sunyuehang/LoongForge-VLA/loongforge/embodied/eval/reports/mock/maniskill/mock_state_smoke/policy_server.log
  loongforge_root: /ssd1/sunyuehang/LoongForge-VLA

timeouts:
  policy_call_ms: 20000
  per_step_sec: 20
  per_episode_sec: 120

run:
  seed: 7
  episode_idx: 0
  output_dir: /ssd1/sunyuehang/LoongForge-VLA/loongforge/embodied/eval/reports/mock/maniskill/mock_state_smoke
  save_replay: false
  save_trace: true
  timestamped_output: true
  disable_action_cache: false
  cfg_scale: 1.0

env:
  eval_root: /ssd1/sunyuehang/LoongForge-VLA/loongforge/embodied/eval
