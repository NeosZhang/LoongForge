model:
  backend: loongforge
  model_type: pi05
  name: pi05
  ckpt_path: ""
  dataset_statistics_path: ""
  random_init: true
  tokenizer_name: /ssd1/huangyi/model/paligemma-3b-pt-224
  action_dim: 7
  state_dim: 7
  action_horizon: 50
  max_action_dim: 32
  max_state_dim: 32
  use_bf16: false
  compile_model: false

benchmark:
  name: maniskill
  task_name: PickCube-v1
  robot_uid: panda
  instruction: pick up the cube
  obs_mode: state
  control_mode: pd_ee_delta_pose
  control_freq: 5
  render_mode: null
  sim_backend: auto
  render_backend: gpu
  camera_name: base_camera
  action_scale: 1.0
  allow_dummy_image: true
  max_steps: 5

server:
  host: 127.0.0.1
  port: 13293
  health_port: 13294
  start_timeout_sec: 900
  log: /ssd1/sunyuehang/LoongForge-VLA/loongforge/embodied/eval/reports/pi05/maniskill/pick_cube_20step/policy_server.log

timeouts:
  policy_call_ms: 20000
  per_step_sec: 20
  per_episode_sec: 600

run:
  seed: 7
  episode_idx: 0
  output_dir: /ssd1/sunyuehang/LoongForge-VLA/loongforge/embodied/eval/reports/pi05/maniskill/pick_cube_20step
  save_replay: true
  save_trace: true
  timestamped_output: true
  disable_action_cache: false
  cfg_scale: 1.5

env:
  loongforge_root: /ssd1/sunyuehang/LoongForge-VLA
