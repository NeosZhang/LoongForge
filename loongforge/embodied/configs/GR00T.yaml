# ═══════════════════════════════════════════════════════════════
# GROOT configuration
# ═══════════════════════════════════════════════════════════════

framework:
  name: GR00T

  # four layers compose
  compose:
    trainer: BCTrainer
    architecture: VLMActionModel
    condition: GlobalProjection
    action: FlowMatchingMSE

  # VLM backbone config
  qwenvl:
    base_vlm: "Qwen/Qwen2.5-VL-3B-Instruct"
    attn_implementation: flash_attention_2
    vl_hidden_dim: 2048

  # Action model config
  action_model:
    action_model_type: DiT-B
    action_dim: 7
    state_dim: 7
    future_action_window_size: 7
    past_action_window_size: 0
    hidden_size: 1024
    repeated_diffusion_steps: 8
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    num_inference_timesteps: 4
    diffusion_model_cfg:
      cross_attention_dim: 2048
      num_layers: 16
      num_heads: 12
      dropout: 0.2

# training config
trainer:
  max_train_steps: 100000
  save_steps: 10000
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  loss_spike_threshold: 100.0
  logging_frequency: 10
  save_format: safetensors
  save_training_state: false
  is_resume: false
  pretrained_checkpoint: null
  freeze_modules: ""
  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    weight_decay: 0.01
    eps: 1.0e-08
  lr_scheduler_type: cosine_with_min_lr
  warmup_steps: 2000
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  ema:
    enabled: false
    decay: 0.99

# running config
seed: 3047
output_root_dir: outputs
run_id: qwen_gr00t_layered
wandb_project: loongforge-vla
wandb_mode: online

# dataset config
datasets:
  vla_data:
    type: "vla"
    dataloader_module: lerobot_datasets
    data_root_dir: /data/lerobot
    dataset_mix: libero_spatial
    robot_type: libero_franka
    per_device_batch_size: 4
    num_workers: 4
    action_horizon: 7
    image_size: 224
    normalization_mode: q99
